name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest tracks GitHub's current default (arm64). A pinned label is
    # more reproducible but rots silently: macos-12 was retired and every run
    # sat in the queue for 24h before being cancelled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install deps
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Run PyInstaller
        run: uv run pyinstaller fidmaa_gui.spec

      - name: Copy files
        run: make macos-copy-files

      - name: Build ZIP
        run: make zip-app

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fidmaa_gui.app.zip
          path: dist/fidmaa_gui.app.zip
