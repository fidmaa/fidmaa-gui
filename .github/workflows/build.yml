name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-latest tracks GitHub's current default (arm64). A pinned label is
    # more reproducible but rots silently: macos-12 was retired and every run
    # sat in the queue for 24h before being cancelled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libheif
        # pyheif-iplweb's compiled extension dlopen()s libheif at import
        # time, hardcoded to the MacPorts path (/opt/local/lib) rather than
        # wherever Homebrew puts it -- symlink it into place. Without this,
        # every test that imports fidmaa_gui.app fails to collect.
        run: |
          brew install libheif
          sudo mkdir -p /opt/local/lib
          sudo ln -sf "$(brew --prefix libheif)/lib/libheif.1.dylib" /opt/local/lib/libheif.1.dylib

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install deps
        run: uv sync

      - name: Run tests
        run: uv run pytest

      # The .app bundle is deliberately NOT built here. It weighs ~850 MB,
      # which is far too much to store on every push. Build it locally with
      # `make all` when you actually need it.
