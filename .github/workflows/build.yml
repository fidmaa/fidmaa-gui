name: Build

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Run PyInstaller
        run: uv run pyinstaller fidmaa_gui.spec

      - name: Copy files
        run: make macos-copy-files

      - name: Build ZIP
        run: make zip-app

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fidmaa_gui.app.zip
          path: dist/fidmaa_gui.app.zip
