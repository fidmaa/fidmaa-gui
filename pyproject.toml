[project]
name = "fidmaa-gui"
version = "0.1.2"
description = "What's FIDMAA?"
authors = [
    {name = "Michał Pasternak", email = "michal.dtz@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.6.2,<7",
    "Pillow>=10.2.0,<11",
    "opencv-python>=4.6.0.66,<5",
    "numpy>=1.23.5,<2",
    "piexif>=1.1.3,<2",
    "beautifulsoup4>=4.11.1,<5",
    "pyheif-iplweb>=0.7.1.dev1176",
    "portrait-analyser[pose]>=0.3.0,<0.4",
    "pyvistaqt>=0.11.0,<0.12",
    "fidmaa-simple-viewer>=0.1.3,<0.2",
    "pyvista>=0.45,<0.48",
    "vtk>=9.0,<9.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=5.6.2,<6",
    "ipdb>=0.13.13,<0.14",
    "pytest>=7.0,<9",
]

[project.scripts]
fidmaa_gui = "fidmaa_gui.entrypoints:run"

[tool.uv.sources]
portrait-analyser = { path = "../portrait-analyser", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidmaa_gui"]

[tool.isort]
profile = "black"
