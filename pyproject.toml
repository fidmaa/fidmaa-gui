[project]
name = "fidmaa-gui"
version = "0.1.2"
description = "Desktop app for 3D facial measurements from iPhone TrueDepth portrait photos"
authors = [
    {name = "Michał Pasternak", email = "michal.dtz@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
    "truedepth",
    "depth-map",
    "heic",
    "anthropometry",
    "facial-measurement",
    "portrait",
    "iphone",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "PySide6>=6.6.2,<7",
    "Pillow>=10.2.0,<11",
    "opencv-python>=4.6.0.66,<5",
    "numpy>=1.23.5,<2",
    "piexif>=1.1.3,<2",
    "beautifulsoup4>=4.11.1,<5",
    "pyheif-iplweb>=0.7.1.dev1176",
    "portrait-analyser[pose]>=0.5.0,<0.6",
    "pyvistaqt>=0.11.0,<0.12",
    "fidmaa-simple-viewer>=0.1.3,<0.2",
    "pyvista>=0.45,<0.48",
    "vtk>=9.0,<9.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=5.6.2,<6",
    "ipdb>=0.13.13,<0.14",
    "pytest>=7.0,<9",
]

[project.urls]
Homepage = "https://github.com/fidmaa/fidmaa-gui"
Repository = "https://github.com/fidmaa/fidmaa-gui"
Issues = "https://github.com/fidmaa/fidmaa-gui/issues"
Changelog = "https://github.com/fidmaa/fidmaa-gui/blob/main/CHANGELOG.md"

[project.scripts]
fidmaa_gui = "fidmaa_gui.entrypoints:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fidmaa_gui"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 + F are ruff's defaults; I adds import sorting (replaces isort).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fidmaa_gui"]
